workflows:
  android-release:
    name: Quran Reels Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build release APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          echo "Generated APK files:"
          find app/build/outputs -type f -name "*.apk" -print
          APK_PATH="$(find app/build/outputs -type f -name "*.apk" -print -quit)"
          test -n "$APK_PATH"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          fi
    artifacts:
      - app/build/outputs/**/*.apk
