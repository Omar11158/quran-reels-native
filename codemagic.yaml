workflows:
  android-release:
    name: Quran Reels Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build release APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          echo "Generated APK files:"
          find app/build/outputs -type f -name "*.apk" -print
          test -n "$(find app/build/outputs -type f -name "*.apk" -print -quit)"
    artifacts:
      - app/build/outputs/**/*.apk
